name: Sparse reservoir forest qualification
on:
  pull_request:
    paths:
      - hamon_pipe_network.py
      - tests/test_pipe_sparse_loops.py
      - tests/test_pipe_sparse_reservoirs.py
      - tests/test_fixed_head_exchange.py
      - tests/test_pipe_minor_exchange.py
      - ship/verify_sparse_reservoirs.py
      - .github/workflows/pipe-forest.yml
jobs:
  hydraulic-forest:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pinned numerical runtime
        run: python -m pip install --disable-pip-version-check numpy==2.2.6 scipy==1.15.3 sympy==1.13.3 mpmath==1.3.0 pytest==8.4.2
      - name: Sparse topology and cancellation regressions
        run: python -m pytest -q tests/test_pipe_sparse_loops.py tests/test_pipe_sparse_reservoirs.py tests/test_fixed_head_exchange.py tests/test_pipe_minor_exchange.py
      - name: Matched cold baseline and candidate
        run: |
          git show d2738eacdc00491e3f62226a33aec7272bfd7ccd:hamon_pipe_network.py > "$RUNNER_TEMP/baseline_pipe.py"
          python ship/verify_sparse_reservoirs.py --baseline "$RUNNER_TEMP/baseline_pipe.py" --output "$RUNNER_TEMP/sparse-reservoirs.json"
      - uses: actions/upload-artifact@v4
        with:
          name: sparse-reservoirs
          path: ${{ runner.temp }}/sparse-reservoirs.json

name: PLE official static qualification and task protocol
on:
  push:
    branches: ["gpt6-mwmq0uei7cnnu3o7/ple-official-static"]
  pull_request:
    paths:
      - "engineering_intake.py"
      - "delivery_guard.py"
      - "delivery_materialize.py"
      - "engineering_toolkit.py"
      - "hamon_drawing.py"
      - "hamon_dxf.py"
      - "hamon_scale.py"
      - "hamon_affine_metric.py"
      - "hamon_callout.py"
      - "harness.py"
      - "ship/check_artifact_provenance.py"
      - "ship/audit_ple_delivery.py"
      - "ship/verify_native_dxf_corpus.py"
      - "ship/verify_pdf_window_corpus.py"
      - "tests/**"
      - ".github/workflows/engineering-intake.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Runtime + official static kit requirements (no model clients)
        run: pip install --disable-pip-version-check -r requirements.txt "pyyaml>=6" "python-dotenv>=1" "huggingface-hub>=1.31,<2" "ifcopenshell==0.9.0.post1"
      - name: System PDF vector tools for real two-sheet drawing contract
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends poppler-utils
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q engineering_intake.py engineering_toolkit.py hamon_drawing.py hamon_dxf.py hamon_scale.py hamon_affine_metric.py hamon_callout.py harness.py taskbridge.py delivery_guard.py delivery_materialize.py ship/check_artifact_provenance.py ship/audit_ple_delivery.py
      - name: Historical public PLE output contract replay (not scored)
        run: python ship/audit_ple_delivery.py
      - name: Exact pinned organizer PLE kit, static validation only
        run: |
          set -euo pipefail
          git clone -q --filter=blob:none https://github.com/google-research/ple.git "$RUNNER_TEMP/ple-upstream"
          git -C "$RUNNER_TEMP/ple-upstream" checkout -q --detach 8320f0402fdca9f42476607f72bcfd5271cd50c9
          echo "Official kit commit: $(git -C "$RUNNER_TEMP/ple-upstream" rev-parse HEAD)"
          PYTHONPATH="$RUNNER_TEMP/ple-upstream" python -m kit validate .
          PYTHONPATH="$RUNNER_TEMP/ple-upstream" python -m kit artifacts . --json > "$RUNNER_TEMP/ple-artifacts-review.json"
          python - "$RUNNER_TEMP/ple-artifacts-review.json" <<'PY'
          import json, pathlib, sys
          result=json.loads(pathlib.Path(sys.argv[1]).read_text())
          print(json.dumps({"artifact_review_keys":sorted(result.keys()),
                            "organizer_static_only":True,
                            "not_a_scored_dev_run":True}))
          PY
      - name: Independent outlined-font CAD sources (not scored PLE)
        run: |
          set -euo pipefail
          git clone -q https://github.com/haiha-ux/cad-sample-tests.git "$RUNNER_TEMP/cad-sample-tests"
          git -C "$RUNNER_TEMP/cad-sample-tests" checkout -q --detach 150f4dce05a41a85d956189de8ded2cdd0d4a4d3
          python ship/verify_native_dxf_corpus.py "$RUNNER_TEMP/cad-sample-tests"
          python ship/verify_pdf_window_corpus.py "$RUNNER_TEMP/cad-sample-tests" --output-dir "$RUNNER_TEMP/pdf-window-corpus"
      - name: Source provenance gate (does not conflate static acceptance with a new model score)
        run: |
          set +e
          python ship/check_artifact_provenance.py .
          rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "::error::PLE artifact source manifest malformed"
            exit 1
          fi
          if [ "$rc" -eq 3 ]; then
            echo "::warning::Inherited organizer artifacts diverge from current HAMON source. Regenerate only after licensed dev data + genuine model run."
          fi
          exit 0

name: PLE official static qualification and task protocol
on:
  push:
    branches: ["gpt6-mwmq0uei7cnnu3o7/ple-official-static"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Runtime + official static kit requirements (no model clients)
        run: pip install --disable-pip-version-check -r requirements.txt "pytest>=8,<10" "python-dotenv>=1" "huggingface-hub>=1.31,<2"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install the actual registered tool runtime
        run: npm ci --no-fund --no-audit
      - name: System PDF vector tools for real two-sheet drawing contract
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends poppler-utils
      - run: python -m unittest discover -s tests -v
      - name: Registered TypeScript/Python tools and physics regression gates
        run: python -m pytest -q tests/test_registered_engineering_verifiers.py tests/test_wired_router_e2e.py tests/test_wave6_physics_verifiers.py tests/test_wave7_engineering_verifiers.py
      - run: python -m compileall -q engineering_intake.py engineering_toolkit.py hamon_drawing.py hamon_preflight.py hamon_dxf.py hamon_scale.py hamon_affine_metric.py hamon_callout.py hamon_dual_verifier.py hamon_cad_takeoff.py hamon_pareto.py harness.py taskbridge.py delivery_guard.py delivery_materialize.py archive_checkpoint.py archive_contract.py ship/check_artifact_provenance.py ship/audit_ple_delivery.py
      - name: Historical public PLE output contract replay (not scored)
        run: python ship/audit_ple_delivery.py
      - name: Exact pinned organizer PLE kit, static validation only
        run: |
          set -euo pipefail
          git clone -q --filter=blob:none https://github.com/google-research/ple.git "$RUNNER_TEMP/ple-upstream"
          git -C "$RUNNER_TEMP/ple-upstream" checkout -q --detach 8320f0402fdca9f42476607f72bcfd5271cd50c9
          echo "Official kit commit: $(git -C "$RUNNER_TEMP/ple-upstream" rev-parse HEAD)"
          PYTHONPATH="$RUNNER_TEMP/ple-upstream" python -m kit validate .
      - name: Independent outlined-font CAD sources (not scored PLE)
        run: |
          set -euo pipefail
          git clone -q https://github.com/haiha-ux/cad-sample-tests.git "$RUNNER_TEMP/cad-sample-tests"
          git -C "$RUNNER_TEMP/cad-sample-tests" checkout -q --detach 150f4dce05a41a85d956189de8ded2cdd0d4a4d3
          python ship/verify_native_dxf_corpus.py "$RUNNER_TEMP/cad-sample-tests"
          python ship/verify_pdf_window_corpus.py "$RUNNER_TEMP/cad-sample-tests" --output-dir "$RUNNER_TEMP/pdf-window-corpus"
      - name: Source provenance gate (does not conflate static acceptance with a new model score)
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/ple-artifacts-review.json"
          rc=0
          python ship/check_artifact_provenance.py . --kit-root "$RUNNER_TEMP/ple-upstream" > "$report" || rc=$?
          if [[ "$rc" != 0 && "$rc" != 3 ]]; then
            cat "$report"
            echo "::error::The organizer could not verify artifact provenance."
            exit 1
          fi
          python - "$report" <<'PYTHON'
          import json, sys
          with open(sys.argv[1]) as file:
              result = json.load(file)
          review = result["kit_review"]
          print(json.dumps({"provenance": review["provenance"], "counts": review["counts"],
                            "warnings": review["warnings"], "problems": review["problems"]}))
          if not review["accepted"]:
              sys.exit("The organizer refused the artifact layout.")
          PYTHON
          if [[ "$rc" == 3 ]]; then
            echo "::warning::Artifact provenance differs from this checkout or dev set. A new score requires a genuine authorized run."
          fi

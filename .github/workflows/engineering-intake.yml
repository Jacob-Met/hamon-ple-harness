name: PLE wire protocol and source provenance
on:
  push:
    branches: ["gpt6-mwmq0uei7cnnu3o7/ple-provenance-gate"]
  pull_request:
    paths:
      - "engineering_intake.py"
      - "engineering_toolkit.py"
      - "harness.py"
      - "ship/check_artifact_provenance.py"
      - "tests/**"
      - ".github/workflows/engineering-intake.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --disable-pip-version-check -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q engineering_intake.py engineering_toolkit.py harness.py taskbridge.py ship/check_artifact_provenance.py
      - name: Source provenance report (expected stale until independently scored dev run)
        run: |
          set +e
          python ship/check_artifact_provenance.py .
          rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "::error::PLE manifest validation failed"
            exit 1
          fi
          if [ "$rc" -eq 3 ]; then
            echo "::warning::PLE artifacts were generated by the inherited organizer harness, not the current HAMON source. Do NOT claim new dev score or submit unchanged artifacts."
          fi
          exit 0

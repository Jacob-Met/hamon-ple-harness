name: Engineering intake and deterministic tools
on:
  push:
    branches: ["gpt6-mwmq0uei7cnnu3o7/ple-engineering-toolkit"]
  pull_request:
    paths:
      - "engineering_intake.py"
      - "engineering_toolkit.py"
      - "harness.py"
      - "tests/**"
      - ".github/workflows/engineering-intake.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q engineering_intake.py engineering_toolkit.py harness.py

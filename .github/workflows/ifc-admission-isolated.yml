name: Audit saved FZK reader evidence
on:
  push:
    branches: ["p2/b1e9c66c-ifc-admission-evidence"]
permissions:
  actions: read
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify immutable artifact metadata
        uses: actions/github-script@v7
        with:
          script: |
            const id = 14883918701
            const artifact = (await github.rest.actions.getArtifact({...context.repo, artifact_id:id})).data
            if (artifact.workflow_run.id !== 45313952958 || artifact.workflow_run.head_sha !== 'a72839e9f2edadcd696f3f6d0a43f6c78dbc4827') throw Error('source run mismatch')
            if (artifact.size_in_bytes !== 28289 || artifact.digest !== 'sha256:84b95bd37bcbdfcf7aa92552ec138ff5e044329dd5e474c7ccb6ff9c5d074b73') throw Error('archive digest mismatch')
            console.log({artifact:id,run:artifact.workflow_run.id,head:artifact.workflow_run.head_sha,bytes:artifact.size_in_bytes,digest:artifact.digest})
      - name: Download archived outputs from the original run
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '14883918701'
          run-id: '45313952958'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/saved
      - name: Reconcile native and registered per-occurrence tables
        run: |
          python - <<'PY'
          import json, os, zipfile, math
          from collections import Counter
          from pathlib import Path
          files=sorted((Path(os.environ['RUNNER_TEMP'])/'saved').rglob('*.json'))
          print('FILES',[p.name for p in files])
          docs={p.name:json.loads(p.read_bytes()) for p in files}
          m=docs['manifest.json']; n=docs['native-results.json']; r=docs['registered-reader.json']
          assert m['source_sha256']==n['source_sha256']=='ea6f04eaf92fac4d7ad0038bc3d2dfea4c094dd3f516ecc33c50bf1835ca108d'
          original={x['step_id']:x for x in m['products']}
          native={int(i):x for i,x in n['per_product'].items()}
          physical={x['step_id']:x for x in r['products'] if x['role']=='physical'}
          assert len(original)==len(native)==len(physical)==82 and original.keys()==native.keys()==physical.keys()
          nr={i for i,v in native.items() if v['status']=='known'}
          rr={i for i,v in physical.items() if v['volume_status']=='known'}
          print('NATIVE',len(nr),[(i,native[i].get('reason')) for i in native.keys()-nr])
          print('REGISTERED', {k:v for k,v in r.items() if k in ('ok','status','known_mesh_count','known_volume_count','unknown_volume_step_ids','unresolved_geometry_step_ids','total_solid_volume_m3','known_occurrence_volume_sum_m3','hard_clash_count','requested_pair_count','evaluated_pair_count','missing_geometry_pair_count','unresolved_pair_count','certified_empty_pair_count','bound_only_pair_count','measured_pair_count')})
          print('REGISTERED_UNKNOWN',[(i,physical[i].get('geometry_status'),physical[i].get('volume_status'),physical[i].get('reason')) for i in sorted(physical.keys()-rr)])
          print('MISSING_NATIVE_KNOWN', sorted(nr-rr),'KNOWN_ONLY_BY_READER',sorted(rr-nr))
          err=[(i,physical[i]['volume_m3'],native[i]['volume_m3']) for i in nr&rr if not math.isclose(physical[i]['volume_m3'],native[i]['volume_m3'],rel_tol=1e-9,abs_tol=1e-9)]
          print('OUTSIDE_NUMERICAL_TOLERANCE',err,'MATCHES',len(nr&rr)-len(err))
          for host,win in [(60012,66459),(67828,74280)]:
              op=n['openings'][str(host)]; p=op['window_parts']
              print('WINDOW',win,'native_part_count',native[win]['native_part_count'],'summed_parts',math.fsum(v['volume_m3'] for v in p),'native_union',op['window_union_m3'],'candidate',physical[win]['volume_m3'],'native_host',native[host].get('volume_m3'),'registered_host',physical[host].get('volume_m3'))
          print('VOLUME_ROWS',[(i,native[i]['volume_m3'],physical[i]['volume_m3']) for i in sorted(physical)])
          print('SOURCE_COMPARISON_PRESENT','source-comparison.json' in docs)
          PY

name: Ordered Janbu exact revision qualification
on:
  push:
    branches: ["p2/b1e9c66c-janbu-qualification"]
permissions:
  contents: read
  statuses: write
jobs:
  janbu:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b4928b92f0c6fffe38a4f82c632d169fb638398c
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: pip install --disable-pip-version-check -r requirements.txt
      - run: npm ci --no-fund --no-audit
      - run: |
          git rev-parse HEAD
          python -m unittest discover -s tests -p 'test_janbu*.py' -v
      - name: Record degree-angle and wet interface intervals
        run: |
          PYTHONPATH=tests:. python - <<'PY'
          import json
          from test_janbu_slices import ibaraki
          from hamon_janbu_slices import verify_janbu_slices
          for n, water in [(6,None),(33,4.)]:
              result = verify_janbu_slices(dict(ibaraki(n, water), slice_order='toe_to_crest', required_factor_of_safety=1.4))
              print(json.dumps({k: result[k] for k in ['verified','factor_of_safety_interval','tensile_interfaces','meets_required_factor']}))
              print(json.dumps(result['interfaces'][-1]))
          PY
      - name: Link this isolated test run
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha: context.sha,
              state: '${{ job.status }}' === 'success' ? 'success' : 'failure',
              context: 'Janbu exact revision replay',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: 'Registered wet and dry geometry and analytic controls'
            })

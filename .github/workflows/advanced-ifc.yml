name: Curved IFC physical takeoff
on:
  pull_request:
    paths:
      - hamon_ifc_spatial_clash.py
      - ship/verify_advanced_ifc.py
      - .github/workflows/advanced-ifc.yml
jobs:
  source-models:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'numpy>=2,<3' ifcopenshell==0.9.0.post1
      - name: Replay both pinned buildingSMART models and six damaged controls
        run: python ship/verify_advanced_ifc.py --output advanced-ifc.json
      - uses: actions/upload-artifact@v4
        with:
          name: advanced-ifc-physical-takeoff
          path: advanced-ifc.json

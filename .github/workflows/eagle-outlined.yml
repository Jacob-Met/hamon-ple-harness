name: Arduino Due outlined schematic connectivity
on:
  pull_request:
    paths:
      - "hamon_eagle_schematic.py"
      - "hamon_eagle_outlined.py"
      - "hamon_drawing.py"
      - "ship/verify_eagle_outlined.py"
      - "ship/verify_eagle_schematic.py"
      - ".github/workflows/eagle-outlined.yml"
permissions:
  contents: read
jobs:
  manufacturer-drawing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF readers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils
          python -m pip install --disable-pip-version-check 'pypdf>=6.21,<7'
      - name: Run the manufacturer drawing and ten physical edits
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/arduino-due-drawing"
          mkdir -p "$fixture"
          curl --fail --silent --show-error --location --retry 2 --max-time 45 \
            https://docs.arduino.cc/resources/schematics/A000056-schematics.pdf --output "$fixture/due.pdf"
          curl --fail --silent --show-error --location --retry 2 --max-time 45 \
            https://docs.arduino.cc/static/f051671bbed80ddf7352991d62cb0d5c/A000056-cad-files.zip \
            --output "$fixture/due.zip"
          python ship/inspect_outlined_labels.py "$fixture/due.pdf" "$fixture/due.zip"
          python ship/verify_eagle_outlined.py "$fixture/due.pdf" "$fixture/due.zip" --controls

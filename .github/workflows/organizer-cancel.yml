name: Organizer cancellation on Linux Docker
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tests/mock_sse_proxy.py"
      - "tests/organizer_cancel/Makefile"
      - ".github/workflows/organizer-cancel.yml"
permissions:
  contents: read
jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # The kit clones the entry's history before building its image.
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Name the exact candidate for the organizer's local Git clone
        run: git switch -c local-organizer-candidate
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the organizer's environment manager
        run: python -m pip install uv
      - name: Run the organizer cancellation stage with the local model fixture
        run: make -C tests/organizer_cancel verify-organizer-cancel

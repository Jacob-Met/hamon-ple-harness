name: Public PLE IFC generator replay (offline, unscored)
on:
  pull_request:
    paths:
      - "ship/replay_public_generators.py"
      - "ship/verify_materializer_end_to_end.py"
      - "delivery_materialize.py"
      - "tests/test_delivery_materialize.py"
      - ".github/workflows/ple-generator-replay.yml"
  workflow_dispatch:
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install IFC4 parser and geometry backend
        run: python -m pip install --disable-pip-version-check 'ifcopenshell==0.8.4'
      - name: Replay historical unexported IFC candidates in scratch
        run: python ship/replay_public_generators.py
      - name: Set up disposable task-container path convention
        run: sudo mkdir -p /filesystem && sudo chown "$(id -u):$(id -g)" /filesystem
      - name: Cold end-to-end run through production materializer and task protocol
        run: python ship/verify_materializer_end_to_end.py

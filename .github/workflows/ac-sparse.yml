name: Sparse AC public network qualification
on:
  pull_request:
    paths:
      - hamon_ac_power_flow.py
      - hamon_ac_sparse.py
      - tests/test_sparse_ac_power_flow.py
      - ship/verify_ac_regulation.py
      - ship/verify_sparse_ac_networks.py
      - .github/workflows/ac-sparse.yml
jobs:
  public-networks:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pinned numerical runtime
        run: python -m pip install --disable-pip-version-check numpy==2.2.6 scipy==1.15.3 sympy==1.13.3 mpmath==1.3.0 pytest==8.4.2
      - name: Solver and source isolation regressions
        run: python -m pytest -q tests/test_sparse_ac_power_flow.py tests/test_ac_power_flow.py tests/test_symmetrical_components.py tests/test_wave8_certified_budget.py
      - name: Pinned public input and independent reference solver
        run: |
          git init "$RUNNER_TEMP/matpower"
          git -C "$RUNNER_TEMP/matpower" remote add origin https://github.com/MATPOWER/matpower.git
          git -C "$RUNNER_TEMP/matpower" fetch --depth=1 origin b6c85b0323d20fb801cab3377c803a285d730847
          git -C "$RUNNER_TEMP/matpower" checkout --detach FETCH_HEAD
          git init "$RUNNER_TEMP/pypower"
          git -C "$RUNNER_TEMP/pypower" remote add origin https://github.com/rwl/PYPOWER.git
          git -C "$RUNNER_TEMP/pypower" fetch --depth=1 origin c7f1cf50bedd34012b92fae4f092ec55617546a8
          git -C "$RUNNER_TEMP/pypower" checkout --detach FETCH_HEAD
      - name: Registered router against all public operating points
        run: python ship/verify_sparse_ac_networks.py "$RUNNER_TEMP/matpower" "$RUNNER_TEMP/pypower" > "$RUNNER_TEMP/sparse-ac-networks.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sparse-ac-networks
          path: ${{ runner.temp }}/sparse-ac-networks.json

name: Saved workbook unit graph qualification
on:
  pull_request:
    paths:
      - "engineering_toolkit.py"
      - "office_package.py"
      - "engineering_intake.py"
      - "taskbridge.py"
      - "tests/test_xlsx*.py"
      - "ship/verify_xlsx_unit_graph.py"
      - ".github/workflows/xlsx-unit-graph.yml"
  workflow_dispatch:
jobs:
  workbook-oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Independent spreadsheet engine and symbolic units
        timeout-minutes: 9
        run: |
          # Use one signed source list for both commands. Hosted runners may
          # enable additional regional mirrors outside the default sources file.
          sources="$RUNNER_TEMP/ple-noble.sources"
          cat > "$sources" <<'SOURCES'
          Types: deb
          URIs: https://archive.ubuntu.com/ubuntu
          Suites: noble noble-updates
          Components: main universe
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

          Types: deb
          URIs: https://security.ubuntu.com/ubuntu
          Suites: noble-security
          Components: main universe
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          SOURCES
          apt_options=(-o "Dir::Etc::sourcelist=$sources" -o "Dir::Etc::sourceparts=-"
                       -o Acquire::https::Timeout=30 -o Acquire::Retries=1)
          sudo timeout 90s apt-get "${apt_options[@]}" update -qq
          sudo env DEBIAN_FRONTEND=noninteractive timeout 360s apt-get "${apt_options[@]}" install -y --no-install-recommends libreoffice-calc
          pip install --disable-pip-version-check --timeout 30 --retries 1 sympy==1.14.0
      - name: Recalculate saved workbook and compare exact unit scales
        run: python ship/verify_xlsx_unit_graph.py --out "$RUNNER_TEMP/xlsx-unit-graph" --min-memory-gib 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xlsx-unit-graph-oracle
          path: ${{ runner.temp }}/xlsx-unit-graph
          if-no-files-found: ignore

name: Link the completed Bishop verification
on:
  push:
    branches: ["dfab0b0b/cold-bishop-475"]
permissions:
  contents: read
  actions: read
  statuses: write
jobs:
  publish-result:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Link the original cold run to its tested source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time, urllib.request
          api="https://api.github.com/repos/Jacob-Met/hamon-ple-harness"
          headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json"}
          def request(path,payload=None):
              raw=None if payload is None else json.dumps(payload).encode()
              req=urllib.request.Request(api+path,data=raw,headers=headers)
              with urllib.request.urlopen(req,timeout=15) as response:
                  return json.load(response)
          for _ in range(12):
              rows=request("/actions/runs?head_sha=338dab3e7874cae1364d2fb61217bbfa0218aa6e")["workflow_runs"]
              matches=[r for r in rows if r["name"]=="Cold specified Bishop circle" and r["head_sha"]=="338dab3e7874cae1364d2fb61217bbfa0218aa6e"]
              if len(matches)==1 and matches[0]["status"]=="completed":
                  break
              time.sleep(6)
          else:
              raise RuntimeError("Original source verification has not completed")
          run=matches[0]
          state="success" if run["conclusion"]=="success" else "failure"
          request("/statuses/fda29d601c55a7705f814784e64d4d553d4c5800",dict(state=state,context="Bishop / pinned cold reconstruction",
                  description="Original stock-versus-candidate registered-tool and force-equilibrium course",
                  target_url=run["html_url"]))
          print(run["html_url"],run["conclusion"])
          PY

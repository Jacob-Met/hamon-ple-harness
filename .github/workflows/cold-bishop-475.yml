name: Cold specified Bishop circle
on:
  push:
    branches: ["dfab0b0b/cold-bishop-475"]
permissions:
  contents: read
jobs:
  registered-equilibrium:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fda29d601c55a7705f814784e64d4d553d4c5800
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install locked Pi runtime and compare stock and candidate endpoints
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/stock" ea1039b479abf763cd3e623d0690697c78699d5f
          cmp package-lock.json "$RUNNER_TEMP/stock/package-lock.json"
          npm ci --no-fund --no-audit
          ln -s "$PWD/node_modules" "$RUNNER_TEMP/stock/node_modules"
          python -m pip install -q -r requirements.txt
          python -m unittest discover -v -s tests -p test_bishop_circle.py
          export STOCK_DIR="$RUNNER_TEMP/stock"
          PYTHONPATH="$PWD/tests:$PWD" python - <<'PY'
          from pathlib import Path
          import json, math, os
          import test_bishop_circle as b
          dry = b.circle([b.slice_data(-6,-4,1000,120,30,0)])
          wet = b.circle([b.slice_data(-6,-4,1000,120,30,95)])
          pole=1/math.sqrt(3)
          specs=[dry, wet, b.manufactured(1.37)[0],
                 b.manufactured(pole+1e-5,True)[0], b.manufactured(pole+1e-15,True)[0],
                 b.circle([b.slice_data(-6,-4,1000,300,30,500)]), b.circle(dry['slices'],'left'),
                 dict(wet,proposed_factor_of_safety=1.70)]
          payloads=[dict(mode='civil_geotech',spec=s) for s in specs]
          current=b.registered(payloads)
          b.ROOT=Path(os.environ['STOCK_DIR'])
          old=b.registered(payloads[:1])
          assert not old[0]['ok'] and not old[0]['conservation_verified'],old
          assert [x['conservation_verified'] for x in current]==[True,True,True,True,False,False,False,False],current
          data=dict(base='ea1039b479abf763cd3e623d0690697c78699d5f', source='fda29d601c55a7705f814784e64d4d553d4c5800', cases=payloads,
                    baseline=old,candidate=current)
          Path('bishop-evidence.json').write_text(json.dumps(data,allow_nan=False))
          for x in old+current:
              print({k:v for k,v in x.items() if k in ('ok','conservation_verified','factor_of_safety','equilibrium_rel_residual','reason')})
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: specified-circle-registered-evidence
          path: bishop-evidence.json

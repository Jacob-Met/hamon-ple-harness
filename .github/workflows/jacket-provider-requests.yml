name: Public jacket balance and provider request comparison
on:
  pull_request:
    paths:
      - "ship/measure_jacket_provider_requests.py"
      - ".github/workflows/jacket-provider-requests.yml"
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Match the actual PR base and locked Pi runtime
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/stock" "$BASE"
          cmp package.json "$RUNNER_TEMP/stock/package.json"
          cmp package-lock.json "$RUNNER_TEMP/stock/package-lock.json"
          npm ci --no-fund --no-audit
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/stock/node_modules"
          python -m pip install -r requirements.txt
          mkdir wire-results
          git rev-parse HEAD > wire-results/candidate.commit
          git -C "$RUNNER_TEMP/stock" rev-parse HEAD > wire-results/stock.commit
      - name: Compare both ordinary provider paths with a loopback SSE response
        run: |
          set -euo pipefail
          python ship/measure_jacket_provider_requests.py --root "$RUNNER_TEMP/stock" > wire-results/stock.jsonl
          python ship/measure_jacket_provider_requests.py --root . > wire-results/candidate.jsonl
          python ship/measure_jacket_provider_requests.py --compare wire-results/{stock,candidate}.jsonl | tee wire-results/comparison.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-jacket-provider-requests
          path: wire-results
          if-no-files-found: warn
